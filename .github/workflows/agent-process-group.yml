name: Agent Unix process-group supervision

on:
  push:
    branches: [work/unix-process-group-supervision]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply process-group patch
        run: |
          python3 .github/agent_process_group.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/hub-executor/src/lib.rs')
          text = p.read_text()
          old = '''        use nix::sys::signal::{getpgid, killpg, Signal};
                  use nix::unistd::Pid;
          '''
          new = '''        use nix::sys::signal::{killpg, Signal};
                  use nix::unistd::{getpgid, Pid};
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one nix test import block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Resolve lockfile
        run: cargo check --workspace
      - name: Format
        run: cargo fmt --all
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: MSRV dependency gate
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check -p hub-executor --locked
      - name: Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test gate
        run: cargo test --workspace --all-features --locked
      - name: Build gate
        run: cargo build --workspace --all-targets --locked
      - name: Doc gate
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Cargo.toml Cargo.lock \
            crates/hub-executor/Cargo.toml \
            crates/hub-executor/src/lib.rs \
            README.md CHANGELOG.md \
            docs/adr/0017-unix-process-group-supervision.md
          git commit -m 'feat: supervise Unix execution process groups'
          git push origin HEAD:work/unix-process-group-supervision
