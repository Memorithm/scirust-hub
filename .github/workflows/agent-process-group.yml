name: Agent Unix process-group supervision

on:
  push:
    branches: [work/unix-process-group-supervision]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply process-group patch
        run: python3 .github/agent_process_group_v2.py
      - name: Fix shell test literal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/hub-executor/src/lib.rs')
          lines = p.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if 'sleep 30 & printf' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one process-group shell test line, found {len(matches)}')
          lines[matches[0]] = r'''            r#"sleep 30 & printf '%s %s\n' "$$" "$!" > "$1"; wait"#.to_owned(),'''
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Resolve lockfile
        run: cargo check --workspace
      - name: Format
        run: cargo fmt --all
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: MSRV dependency gate
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check -p hub-executor --locked
      - name: Capture Clippy diagnostic
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings \
            >.github/clippy-diagnostic.txt 2>&1
          status=$?
          cat .github/clippy-diagnostic.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist Clippy diagnostic
        if: steps.clippy.outputs.status != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/clippy-diagnostic.txt
          git commit -m 'ci: capture process-group clippy diagnostic'
          git push origin HEAD:work/unix-process-group-supervision
      - name: Fail on Clippy diagnostic
        if: steps.clippy.outputs.status != '0'
        run: exit 1
      - name: Test gate
        if: steps.clippy.outputs.status == '0'
        run: cargo test --workspace --all-features --locked
      - name: Build gate
        if: steps.clippy.outputs.status == '0'
        run: cargo build --workspace --all-targets --locked
      - name: Doc gate
        if: steps.clippy.outputs.status == '0'
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - name: Commit verified implementation
        if: steps.clippy.outputs.status == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/clippy-diagnostic.txt || true
          git add \
            Cargo.toml Cargo.lock \
            crates/hub-executor/Cargo.toml \
            crates/hub-executor/src/lib.rs \
            README.md CHANGELOG.md \
            docs/adr/0017-unix-process-group-supervision.md
          git commit -m 'feat: supervise Unix execution process groups'
          git push origin HEAD:work/unix-process-group-supervision
