name: Agent per-worker bearer credentials

on:
  push:
    branches: [work/per-worker-bearer-credentials]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply credential patch
        run: python3 .github/agent_per_worker_credentials.py
      - name: Normalize JSON test literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/scirust-hubd/src/main.rs')
          lines = p.read_text().splitlines()
          changed = 0
          for i, line in enumerate(lines):
              if 'Some(r#"' in line and '\\"http://worker-' in line:
                  lines[i] = line.replace('\\"', '"')
                  changed += 1
          if changed != 7:
              raise SystemExit(f'expected to normalize 7 JSON test literals, changed {changed}')
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Format
        run: cargo fmt --all
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Check gate
        run: cargo check --workspace --all-targets --locked
      - name: Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test gate
        run: cargo test --workspace --all-features --locked
      - name: Build gate
        run: cargo build --workspace --all-targets --locked
      - name: Doc gate
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - name: Secret-redaction source gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q '\[REDACTED\]' crates/hub-executor/src/remote.rs
          if grep -R --line-number --fixed-strings 'top-secret-token' \
            README.md CHANGELOG.md docs/adr apps/scirust-hubd/src/main.rs crates/hub-executor/src/pool.rs; then
            echo 'test-only secret escaped intended remote.rs test scope' >&2
            exit 1
          fi
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/scirust-hubd/Cargo.toml \
            apps/scirust-hubd/src/main.rs \
            crates/hub-executor/src/pool.rs \
            crates/hub-executor/src/remote.rs \
            README.md CHANGELOG.md \
            docs/adr/0018-per-worker-bearer-credentials.md
          git commit -m 'feat: isolate remote worker bearer credentials'
          git push origin HEAD:work/per-worker-bearer-credentials
