name: PR6 review fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/run-reproduction
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
      - name: Apply reviewed patch
        shell: bash
        run: |
          git show e273675248b87f002627196e885e55d730899b0c:.github/workflows/pr6-review-fix.yml > /tmp/original-fix.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/original-fix.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          exec(compile(textwrap.dedent(workflow[start:end]), '<pr6-review-fix>', 'exec'))

          p = Path('crates/hub-core/src/orchestrator.rs')
          s = p.read_text()
          old = '''        if let Some(required_version) = required_component_version {
                      if manifest.version != required_version {
                          return Err(CoreError::Validation(format!(
                              "component {} evolved to {} since the original run (recorded {}); reproduction requires the same version",
                              manifest.id, manifest.version, required_version
                          )));
                      }
                  }
          '''
          new = '''        if let Some(required_version) =
                      required_component_version.filter(|version| manifest.version != *version)
                  {
                      return Err(CoreError::Validation(format!(
                          "component {} evolved to {} since the original run (recorded {}); reproduction requires the same version",
                          manifest.id, manifest.version, required_version
                      )));
                  }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'clippy refinement: expected one match, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy diagnostic
        id: clippy
        continue-on-error: true
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings > /tmp/pr6-clippy.txt 2>&1
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pr6-clippy-diagnostic
          path: |
            /tmp/pr6-clippy.txt
            crates/hub-core/src/orchestrator.rs
      - name: Require clean Clippy
        if: steps.clippy.outcome != 'success'
        shell: bash
        run: |
          cat /tmp/pr6-clippy.txt
          exit 1
      - name: Build
        if: steps.clippy.outcome == 'success'
        run: cargo build --workspace --all-targets --locked
      - name: Test
        if: steps.clippy.outcome == 'success'
        run: cargo test --workspace --all-features --locked
      - name: Doc
        if: steps.clippy.outcome == 'success'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Commit verified fixes
        if: steps.clippy.outcome == 'success'
        shell: bash
        run: |
          git config user.name "SciRust Hub review fix"
          git config user.email "actions@users.noreply.github.com"
          git add crates/hub-core/src/orchestrator.rs
          git diff --cached --check
          git commit -m "fix: address PR #6 review findings"
          git push origin HEAD:feat/run-reproduction
