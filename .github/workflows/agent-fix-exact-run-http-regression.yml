name: Agent qualify exact-run HTTP regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  qualify:
    if: github.head_ref == 'feat/exact-run-admission-pins'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/exact-run-admission-pins
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Align HTTP reproduction regression with immutable exact-version semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/scirust-hubd/tests/http_e2e.rs')
          s = p.read_text()
          old = '''    // Version drift blocks reproduction of runs recorded under old versions.\n    let drifted = echo_manifest(&id).replace("\\\"version\\\": \\"1.0.0\\\"", "\\\"version\\\": \\"2.0.0\\\"");\n    let (status, _) =\n        http(port, "POST", "/api/v1/components", Some(&drifted)).expect("register v2");\n    assert_eq!(status, 201);\n    let (status, body) = http(\n        port,\n        "POST",\n        &format!("/api/v1/runs/{original_id}/reproduce"),\n        None,\n    )\n    .expect("reproduce after drift");\n    assert_eq!(status, 422, "body: {body}");\n    assert!(body.contains("evolved"), "body: {body}");\n'''
          new = '''    // Registering a newer immutable version must not redirect reproduction of\n    // the original run: the reproduced run remains pinned to v1.\n    let drifted = echo_manifest(&id).replace("\\\"version\\\": \\"1.0.0\\\"", "\\\"version\\\": \\"2.0.0\\\"");\n    let (status, _) =\n        http(port, "POST", "/api/v1/components", Some(&drifted)).expect("register v2");\n    assert_eq!(status, 201);\n    let (status, body) = http(\n        port,\n        "POST",\n        &format!("/api/v1/runs/{original_id}/reproduce"),\n        None,\n    )\n    .expect("reproduce after newer registration");\n    assert_eq!(status, 201, "body: {body}");\n    assert!(body.contains("\\\"component_version\\\":\\\"1.0.0\\\""), "body: {body}");\n    let drift_repro_id: String = json_field(&body, "\\\"id\\\":\\\"").expect("drift repro id");\n    let (status, executed) = http(\n        port,\n        "POST",\n        "/api/v1/executions",\n        Some(&serde_json::json!(drift_repro_id).to_string()),\n    )\n    .expect("execute exact-version reproduction");\n    assert_eq!(status, 200, "body: {executed}");\n    assert!(executed.contains("\\\"component_version\\\":\\\"1.0.0\\\""), "body: {executed}");\n    assert!(executed.contains("\\\"succeeded\\\""), "body: {executed}");\n'''
          if s.count(old) != 1:
              raise SystemExit(f'HTTP reproduction regression anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Full workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Full workspace clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Commit regression fix
        shell: bash
        run: |
          git config user.name "ZEKRITI TAREK"
          git config user.email "contact@checkupauto.fr"
          git add apps/scirust-hubd/tests/http_e2e.rs
          git commit -m "test(api): preserve exact-version reproduction after registry evolution"
          git push origin HEAD:feat/exact-run-admission-pins
