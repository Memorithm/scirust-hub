name: CI

# Gates are the same commands documented in README.md and run locally;
# they must stay runnable locally with identical results.
#
# Pinned to commit SHAs (least-privilege supply-chain hygiene, same policy as
# the SciRust repository). Bump by resolving the tag to a fresh SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: fmt / clippy / build / test / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Restore cargo caches
        uses: swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: SOUP adapter contract
        run: python3 -m unittest scripts/test_soup_hub_adapter.py

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
