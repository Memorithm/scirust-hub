name: Agent publication orchestrator patch runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'agent/publication-orchestrator-g2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-orchestrator-g2
          fetch-depth: 0
      - name: Apply patch
        run: python3 .agent/apply_publication_g2.py
      - name: Format
        run: cargo fmt --all
      - name: Hub core tests
        run: cargo test -p hub-core
      - name: Daemon compile check
        run: cargo check -p scirust-hubd
      - name: Persist validated patch
        shell: bash
        run: |
          rm .agent/apply_publication_g2.py
          rm .github/workflows/agent-publication-orchestrator-g2.yml
          rm .github/workflows/agent-publication-pr-run.yml
          git config user.name "ZEKRITI TAREK"
          git config user.email "contact@checkupauto.fr"
          git add crates/hub-core/src/orchestrator.rs apps/scirust-hubd/src/main.rs .agent/apply_publication_g2.py .github/workflows/agent-publication-orchestrator-g2.yml .github/workflows/agent-publication-pr-run.yml
          git commit -m "feat(workflow): enforce authoritative step publication"
          git push origin HEAD:agent/publication-orchestrator-g2
