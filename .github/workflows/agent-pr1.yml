name: Finalize PR1 branch

on:
  push:
    branches: [work/cancellation-retries]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Remove temporary validation machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-pr1.yml .github/agent_pr1.py .github/agent_pr1_fix.py
          git commit -m 'chore: remove temporary PR1 validation machinery'
          git push origin HEAD:work/cancellation-retries
