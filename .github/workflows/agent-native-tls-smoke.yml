name: Agent native TLS smoke

on:
  push:
    branches: [work/native-tls]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Resolve lockfile
        run: cargo check --workspace
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test gate
        run: cargo test --workspace --all-features --locked
      - name: Build gate
        run: cargo build --workspace --all-targets --locked
      - name: Doc gate
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - name: Native HTTPS smoke
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cleanup() {
            set +e
            [[ -n "${HUB_PID:-}" ]] && kill "$HUB_PID" 2>/dev/null
            [[ -n "${WORKER_PID:-}" ]] && kill "$WORKER_PID" 2>/dev/null
            rm -rf "$TMP"
          }
          trap cleanup EXIT

          diagnose_dead_process() {
            local name="$1" pid="$2" out="$3" err="$4"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "===== ${name} exited before readiness =====" >&2
              echo "----- stdout -----" >&2
              cat "$out" >&2 || true
              echo "----- stderr -----" >&2
              cat "$err" >&2 || true
              wait "$pid" || true
              return 1
            fi
          }

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$TMP/ca-key.pem" -out "$TMP/ca-cert.pem" \
            -subj '/CN=SciRust Hub CI Test CA' -days 1 -sha256 \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$TMP/server-key.pem" -out "$TMP/server.csr" \
            -subj '/CN=localhost' >/dev/null 2>&1
          cat > "$TMP/server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost,IP:127.0.0.1
          EOF
          openssl x509 -req -in "$TMP/server.csr" \
            -CA "$TMP/ca-cert.pem" -CAkey "$TMP/ca-key.pem" -CAcreateserial \
            -out "$TMP/server-cert.pem" -days 1 -sha256 \
            -extfile "$TMP/server.ext" >/dev/null 2>&1

          sudo cp "$TMP/ca-cert.pem" /usr/local/share/ca-certificates/scirust-hub-ci.crt
          sudo update-ca-certificates >/dev/null

          export SCIRUST_HUB_TOKEN='hub-ci-secret'
          export SCIRUST_HUB_TLS_CERT="$TMP/server-cert.pem"
          export SCIRUST_HUB_TLS_KEY="$TMP/server-key.pem"
          target/debug/scirust-hubd \
            --listen 127.0.0.1:18477 \
            --store memory \
            --data-dir "$TMP/hub-data" \
            >"$TMP/hub.out" 2>"$TMP/hub.err" &
          HUB_PID=$!
          HUB_READY=0
          for _ in $(seq 1 50); do
            diagnose_dead_process hub "$HUB_PID" "$TMP/hub.out" "$TMP/hub.err"
            if curl --silent --show-error --fail \
              --cacert "$TMP/ca-cert.pem" \
              https://localhost:18477/health >"$TMP/hub-health"; then
              HUB_READY=1
              break
            fi
            sleep 0.1
          done
          if [[ "$HUB_READY" != 1 ]]; then
            echo 'Hub did not become HTTPS-ready' >&2
            cat "$TMP/hub.out" >&2 || true
            cat "$TMP/hub.err" >&2 || true
            exit 1
          fi
          if curl --silent --fail http://127.0.0.1:18477/health >/dev/null 2>&1; then
            echo 'plaintext HTTP unexpectedly succeeded against Hub TLS port' >&2
            exit 1
          fi

          export SCIRUST_HUB_WORKER_TOKEN='worker-ci-secret'
          export SCIRUST_HUB_WORKER_TLS_CERT="$TMP/server-cert.pem"
          export SCIRUST_HUB_WORKER_TLS_KEY="$TMP/server-key.pem"
          target/debug/scirust-hub-worker \
            --listen 127.0.0.1:18488 \
            --worker-id ci-worker \
            --data-dir "$TMP/worker-data" \
            >"$TMP/worker.out" 2>"$TMP/worker.err" &
          WORKER_PID=$!
          WORKER_READY=0
          for _ in $(seq 1 50); do
            diagnose_dead_process worker "$WORKER_PID" "$TMP/worker.out" "$TMP/worker.err"
            if curl --silent --show-error --fail \
              --cacert "$TMP/ca-cert.pem" \
              -H 'Authorization: Bearer worker-ci-secret' \
              https://localhost:18488/v1/worker >"$TMP/worker.json"; then
              WORKER_READY=1
              break
            fi
            sleep 0.1
          done
          if [[ "$WORKER_READY" != 1 ]]; then
            echo 'Worker did not become HTTPS-ready' >&2
            cat "$TMP/worker.out" >&2 || true
            cat "$TMP/worker.err" >&2 || true
            exit 1
          fi
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cacert "$TMP/ca-cert.pem" https://localhost:18488/v1/worker)"
          test "$status" = '401'
          if curl --silent --fail http://127.0.0.1:18488/v1/worker >/dev/null 2>&1; then
            echo 'plaintext HTTP unexpectedly succeeded against worker TLS port' >&2
            exit 1
          fi

          kill "$HUB_PID" "$WORKER_PID"
          wait "$HUB_PID" || true
          wait "$WORKER_PID" || true
          unset HUB_PID WORKER_PID

          printf 'not a private key\n' > "$TMP/bad-key.pem"
          env SCIRUST_HUB_TLS_CERT="$TMP/server-cert.pem" \
            SCIRUST_HUB_TLS_KEY="$TMP/bad-key.pem" \
            target/debug/scirust-hubd --listen 127.0.0.1:18479 --store memory \
            --data-dir "$TMP/bad-hub" >/dev/null 2>"$TMP/bad-hub.err" &
          BAD_HUB_PID=$!
          sleep 0.5
          if kill -0 "$BAD_HUB_PID" 2>/dev/null; then
            kill "$BAD_HUB_PID" || true
            echo 'Hub stayed alive with malformed TLS private key' >&2
            exit 1
          fi
          wait "$BAD_HUB_PID" && { echo 'Hub accepted malformed TLS private key' >&2; exit 1; } || true

          env SCIRUST_HUB_WORKER_TOKEN='worker-ci-secret' \
            SCIRUST_HUB_WORKER_TLS_CERT="$TMP/server-cert.pem" \
            SCIRUST_HUB_WORKER_TLS_KEY="$TMP/bad-key.pem" \
            target/debug/scirust-hub-worker --listen 127.0.0.1:18489 \
            --data-dir "$TMP/bad-worker" >/dev/null 2>"$TMP/bad-worker.err" &
          BAD_WORKER_PID=$!
          sleep 0.5
          if kill -0 "$BAD_WORKER_PID" 2>/dev/null; then
            kill "$BAD_WORKER_PID" || true
            echo 'Worker stayed alive with malformed TLS private key' >&2
            exit 1
          fi
          wait "$BAD_WORKER_PID" && { echo 'Worker accepted malformed TLS private key' >&2; exit 1; } || true
      - name: Commit lockfile update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock native certificate trust dependencies'
            git push origin HEAD:work/native-tls
          fi
