name: Agent qualify workflow exact admission pins v2

on:
  push:
    branches: [feat/workflow-exact-admission-pins]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/workflow-exact-admission-pins
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Extract source-generation scripts from v1 qualification vehicle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/agent-workflow-exact-admission.yml').read_text().splitlines()

          def extract(step_name: str, out: str) -> None:
              marker = f'      - name: {step_name}'
              start = source.index(marker)
              run = next(i for i in range(start + 1, len(source)) if source[i] == '        run: |')
              body = []
              for line in source[run + 1:]:
                  if line.startswith('      - name: '):
                      break
                  body.append(line[10:] if line.startswith('          ') else line)
              Path(out).write_text('\n'.join(body) + '\n')

          extract('Apply workflow admission source slice', '/tmp/apply-source.sh')
          extract('Add exact workflow admission contract tests', '/tmp/add-tests.sh')
          PY
      - name: Apply source slice and tests
        shell: bash
        run: |
          bash /tmp/apply-source.sh
          bash /tmp/add-tests.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/hub-core/tests/workflow_exact_admission.rs')
          s = p.read_text()
          old = 'fn pins(id: ComponentId, manifest: &ComponentManifest) -> WorkflowAdmissionPins {'
          if s.count(old) != 1:
              raise SystemExit(f'pin helper signature count={s.count(old)}')
          s = s.replace(old, 'fn pins(manifest: &ComponentManifest) -> WorkflowAdmissionPins {', 1)
          if s.count('pins(id, &v1)') != 3:
              raise SystemExit(f'pin helper call count={s.count("pins(id, &v1)")}')
          p.write_text(s.replace('pins(id, &v1)', 'pins(&v1)'))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Full workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Full workspace clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Commit source slice
        shell: bash
        run: |
          git config user.name "ZEKRITI TAREK"
          git config user.email "contact@checkupauto.fr"
          git add crates/hub-core/src crates/hub-core/tests crates/hub-protocol/src crates/hub-api/src
          git commit -m "feat(workflow): enforce exact component admission pins"
          git push origin HEAD:feat/workflow-exact-admission-pins
