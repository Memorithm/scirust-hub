name: Agent PR4 distributed executor

on:
  push:
    branches: [work/distributed-executor]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: python3 .github/agent_pr4.py
      - name: Refresh lockfile for workspace member
        run: cargo check --workspace
      - name: Format
        run: cargo fmt --all
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test gate
        run: cargo test --workspace --all-features --locked
      - name: Build gate
        run: cargo build --workspace --all-targets --locked
      - name: Doc gate
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - name: Distributed contract regression
        run: |
          cargo test -p hub-executor --test remote_worker --locked -- --nocapture
          cargo test -p hub-executor duplicate_remote_result_is_idempotent_and_conflicting_result_is_rejected --locked -- --nocapture
          cargo test -p hub-executor duplicate_attempt_is_idempotent_but_payload_drift_conflicts --locked -- --nocapture
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock crates apps docs
          git diff --cached --quiet && { echo 'no source changes'; exit 1; }
          git commit -m 'feat: add authenticated distributed executor substrate'
          git push origin HEAD:work/distributed-executor
