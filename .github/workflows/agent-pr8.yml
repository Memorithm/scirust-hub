name: Agent PR8 multi-worker placement

on:
  push:
    branches: [work/multi-worker-placement]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: |
          python3 .github/agent_pr8_fix1.py
          python3 .github/agent_pr8_fix2.py
          python3 .github/agent_pr8.py
      - name: Check
        run: cargo check --workspace
      - name: Format
        run: cargo fmt --all
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test gate
        run: cargo test --workspace --all-features --locked
      - name: Build gate
        run: cargo build --workspace --all-targets --locked
      - name: Doc gate
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - name: Multi-worker regressions
        run: |
          cargo test -p hub-executor --test remote_worker remote_pool_places_concurrent_runs_on_distinct_workers --locked -- --nocapture
          cargo test -p hub-executor --test remote_worker remote_pool_rejects_duplicate_worker_identity_before_dispatch --locked -- --nocapture
          cargo test -p hub-core per_invocation_executor_target_is_recorded_in_run_provenance --locked -- --nocapture
          cargo test -p scirust-hubd repeated_remote_worker_urls_select_pool_configuration --locked -- --nocapture
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md crates apps docs Cargo.toml Cargo.lock
          git diff --cached --quiet && { echo 'no source changes'; exit 1; }
          git commit -m 'feat: add configured multi-worker placement'
          git push origin HEAD:work/multi-worker-placement
