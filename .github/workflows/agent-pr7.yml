name: Agent PR7 metrics surface

on:
  push:
    branches: [work/metrics-surface]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: python3 .github/agent_pr7.py
      - name: Check
        run: cargo check --workspace
      - name: Format
        run: cargo fmt --all
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test gate
        run: cargo test --workspace --all-features --locked
      - name: Build gate
        run: cargo build --workspace --all-targets --locked
      - name: Doc gate
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - name: Metrics regressions
        run: |
          cargo test -p hub-api renderer_is_stable_low_cardinality_and_line_terminated --locked -- --nocapture
          cargo test -p hub-api metrics_are_prometheus_text_and_derived_from_authoritative_state --locked -- --nocapture
          cargo test -p hub-api bearer_auth_protects_api_but_not_health_endpoints --locked -- --nocapture
          cargo test -p hub-store-sqlite lifecycle_events_are_cursor_ordered_idempotent_and_durable --locked -- --nocapture
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md Cargo.toml Cargo.lock crates apps docs
          git diff --cached --quiet && { echo 'no source changes'; exit 1; }
          git commit -m 'feat: expose derived operational metrics'
          git push origin HEAD:work/metrics-surface
