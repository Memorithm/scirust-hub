name: Temporary HUB2 static principal staging

on:
  push:
    branches: [staging/hub2-static-principals]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply HUB2 coverage hardening
        run: python3 .tmp/hub2_harden.py
      - name: Format
        run: cargo fmt --all
      - name: Validate exact product source
        run: |
          cargo fmt --all -- --check
          cargo check --workspace
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo build --workspace --all-targets --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - name: Commit validated product files only
        run: |
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add crates/hub-api/src/lib.rs docs/adr/0019-static-principal-authorization.md
          git commit -m 'test(authz): cover every control mutation category'
          git push origin HEAD:staging/hub2-static-principals
