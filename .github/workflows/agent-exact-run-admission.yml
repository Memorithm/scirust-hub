name: Agent qualify exact run admission primitives

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  qualify:
    if: github.head_ref == 'feat/exact-run-admission-pins'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/exact-run-admission-pins
          fetch-depth: 0
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - name: Scope in-memory source patch to component registry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.agent/add_exact_run_admission.py')
          s = p.read_text()
          old = '''    if count != 1:\n        raise SystemExit(f"{path}: {label}: expected one match, found {count}")\n    p.write_text(s.replace(old, new, 1))\n'''
          new = '''    if count != 1:\n        if label == "in-memory exact get" and count == 2:\n            p.write_text(s.replace(old, new, 1))\n            return\n        raise SystemExit(f"{path}: {label}: expected one match, found {count}")\n    p.write_text(s.replace(old, new, 1))\n'''
          if old not in s:
              raise SystemExit('replace_once helper shape changed')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply source patch
        run: python3 .agent/add_exact_run_admission.py
      - name: Complete composite exact lookup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/hub-core/src/memory.rs')
          s = p.read_text()
          old = '''    fn latest(&self, id: &ComponentId) -> Result<Option<ComponentManifest>, CoreError> {\n        ComponentRepository::latest(&self.components, id)\n    }\n\n    fn list(&self) -> Result<Vec<ComponentManifest>, CoreError> {\n        ComponentRepository::list(&self.components)\n    }\n}\n\nimpl RunRepository for InMemoryHubStore {\n'''
          new = '''    fn latest(&self, id: &ComponentId) -> Result<Option<ComponentManifest>, CoreError> {\n        ComponentRepository::latest(&self.components, id)\n    }\n\n    fn get(\n        &self,\n        id: &ComponentId,\n        version: &Version,\n    ) -> Result<Option<ComponentManifest>, CoreError> {\n        ComponentRepository::get(&self.components, id, version)\n    }\n\n    fn list(&self) -> Result<Vec<ComponentManifest>, CoreError> {\n        ComponentRepository::list(&self.components)\n    }\n}\n\nimpl RunRepository for InMemoryHubStore {\n'''
          if s.count(old) != 1:
              raise SystemExit(f'composite component registry anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Align reproduction regression with immutable exact-version semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/hub-core/src/orchestrator.rs')
          s = p.read_text()
          old = '''        // Version drift after queueing must also block execution; the\n        // reproduction can never silently pick up a newer manifest.\n        let drifted = echo_manifest(manifest.id);\n        let drifted = ComponentManifest {\n            version: Version::parse("9.9.9").expect("v"),\n            ..drifted\n        };\n        hub.orch.register_component(drifted).expect("register v9");\n        match hub.orch.execute_run(reproduction.id) {\n            Err(CoreError::Validation(msg)) => {\n                assert!(msg.contains("evolved"), "message: {msg}");\n                assert!(msg.contains("recorded 1.0.0"), "message: {msg}");\n            }\n            other => panic!("expected execution-time drift rejection, got {other:?}"),\n        }\n        match hub.orch.reproduce_run(original.id) {\n            Err(CoreError::Validation(msg)) => {\n                assert!(msg.contains("evolved"), "message: {msg}");\n            }\n            other => panic!("expected drift rejection, got {other:?}"),\n        }\n\n        // A run recorded under the CURRENT version reproduces fine.\n'''
          new = '''        // Registering a newer immutable version after queueing must not redirect\n        // execution or reproduction: both stay pinned to the recorded v1 entry.\n        let drifted = echo_manifest(manifest.id);\n        let drifted = ComponentManifest {\n            version: Version::parse("9.9.9").expect("v"),\n            ..drifted\n        };\n        hub.orch.register_component(drifted).expect("register v9");\n        let old_done = hub\n            .orch\n            .execute_run(reproduction.id)\n            .expect("execute exact recorded version");\n        assert_eq!(old_done.state, RunState::Succeeded);\n        assert_eq!(old_done.component_version.as_str(), "1.0.0");\n\n        let old_again = hub\n            .orch\n            .reproduce_run(original.id)\n            .expect("reproduce exact recorded version");\n        assert_eq!(old_again.component_version.as_str(), "1.0.0");\n        assert_eq!(old_again.reproduced_from, Some(original.id));\n        let old_again_done = hub\n            .orch\n            .execute_run(old_again.id)\n            .expect("execute exact reproduction");\n        assert_eq!(old_again_done.state, RunState::Succeeded);\n        assert_eq!(old_again_done.component_version.as_str(), "1.0.0");\n\n        // A run recorded under the CURRENT version reproduces fine.\n'''
          if s.count(old) != 1:
              raise SystemExit(f'reproduction regression anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format
        run: cargo +1.89.0 fmt --all
      - name: Test Hub core and SQLite store
        run: cargo +1.89.0 test -p hub-core -p hub-store-sqlite --all-targets
      - name: Clippy Hub core and SQLite store
        run: cargo +1.89.0 clippy -p hub-core -p hub-store-sqlite --all-targets -- -D warnings
      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet -- crates/hub-core/src crates/hub-core/tests crates/hub-store-sqlite/src; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name "ZEKRITI TAREK"
          git config user.email "contact@checkupauto.fr"
          git add crates/hub-core/src crates/hub-core/tests crates/hub-store-sqlite/src
          git commit -m "feat(registry): pin exact run manifest identity"
          git push origin HEAD:feat/exact-run-admission-pins
