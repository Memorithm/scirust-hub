          text = store.read_text()
          marker = '''/// Repository of workflow records.\npub trait WorkflowRepository: Send + Sync {\n'''
          addition = '''/// Durable Hub-owned publication-fence and authoritative metadata port.\n///\n/// Fence advance and publication are generic orchestration operations. They\n/// contain no scientific verdict semantics. Implementations must make the\n/// current-fence check atomic with publication-slot insertion.\npub trait PublicationRepository: Send + Sync {\n    /// Advance `(workflow, step_key)` to a fresh monotone generation for\n    /// `attempt` and return the durable current fence.\n    ///\n    /// # Errors\n    /// Validation, generation overflow or backend failures.\n    fn advance_publication_fence(\n        &self,\n        workflow: crate::id::WorkflowId,\n        step_key: &str,\n        attempt: crate::id::AttemptId,\n    ) -> Result<crate::publication::PublicationFence, CoreError>;\n\n    /// Return the current durable fence for one workflow step, if any.\n    ///\n    /// # Errors\n    /// Backend failures only.\n    fn current_publication_fence(\n        &self,\n        workflow: crate::id::WorkflowId,\n        step_key: &str,\n    ) -> Result<Option<crate::publication::PublicationFence>, CoreError>;\n\n    /// Atomically verify `fence` is current and bind one logical output slot\n    /// to artifact metadata. Identical replay returns the first artifact id;\n    /// stale fences and conflicting duplicates fail closed.\n    ///\n    /// # Errors\n    /// [`CoreError::PublicationFenceStale`],\n    /// [`CoreError::AuthoritativePublicationConflict`], validation or backend failures.\n    fn publish_authoritative_artifact(\n        &self,\n        fence: &crate::publication::PublicationFence,\n        output_key: &str,\n        meta: &ArtifactMeta,\n    ) -> Result<crate::publication::AuthoritativePublication, CoreError>;\n}\n\n'''
