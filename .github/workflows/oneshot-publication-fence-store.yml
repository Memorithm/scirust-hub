              '    ArtifactMetadataRepository, ComponentRepository, RunRepository, WorkflowRepository,\n',
              '    ArtifactMetadataRepository, ComponentRepository, PublicationRepository, RunRepository,\n    WorkflowRepository,\n',
              1,
          )
          # Add forward-only v4 migration after lifecycle v3 string.\n          needle = '''    "CREATE TABLE lifecycle_events (\n        sequence        INTEGER PRIMARY KEY AUTOINCREMENT,\n        recorded_at     INTEGER NOT NULL,\n        kind            TEXT    NOT NULL,\n        entity_type     TEXT    NOT NULL,\n        entity_id       TEXT    NOT NULL,\n        attributes_json TEXT    NOT NULL\n    );\n    CREATE INDEX idx_lifecycle_events_entity\n        ON lifecycle_events (entity_type, entity_id, sequence);",\n];\n'''
          repl = '''    "CREATE TABLE lifecycle_events (\n        sequence        INTEGER PRIMARY KEY AUTOINCREMENT,\n        recorded_at     INTEGER NOT NULL,\n        kind            TEXT    NOT NULL,\n        entity_type     TEXT    NOT NULL,\n        entity_id       TEXT    NOT NULL,\n        attributes_json TEXT    NOT NULL\n    );\n    CREATE INDEX idx_lifecycle_events_entity\n        ON lifecycle_events (entity_type, entity_id, sequence);",\n    // v4: durable authoritative-publication fencing.\n    "CREATE TABLE publication_fences (\n        workflow_id TEXT NOT NULL,\n        step_key    TEXT NOT NULL,\n        attempt_id  TEXT NOT NULL,\n        generation  INTEGER NOT NULL CHECK (generation > 0),\n        PRIMARY KEY (workflow_id, step_key)\n    );\n    CREATE TABLE authoritative_publications (\n        workflow_id TEXT NOT NULL,\n        step_key    TEXT NOT NULL,\n        generation  INTEGER NOT NULL,\n        output_key  TEXT NOT NULL,\n        artifact_id TEXT NOT NULL UNIQUE,\n        PRIMARY KEY (workflow_id, step_key, generation, output_key),\n        FOREIGN KEY (artifact_id) REFERENCES artifact_meta(id)\n    );",\n];\n'''
          if needle not in text:
              raise SystemExit('sqlite migration marker not found')
          text = text.replace(needle, repl, 1)

          marker = '''impl WorkflowRepository for SqliteStore {\n'''
          impl_block = r'''impl PublicationRepository for SqliteStore {
    fn advance_publication_fence(
        &self,
        workflow: hub_core::WorkflowId,
        step_key: &str,
        attempt: hub_core::AttemptId,
    ) -> Result<hub_core::PublicationFence, CoreError> {
        hub_core::publication::validate_publication_key(step_key, "step key")?;
        let mut conn = self.lock()?;
        let tx = conn
            .transaction()
            .map_err(storage("beginning publication fence advance"))?;
        let current: Option<i64> = tx
            .query_row(
                "SELECT generation FROM publication_fences WHERE workflow_id = ?1 AND step_key = ?2",
                rusqlite::params![workflow.to_string(), step_key],
                |row| row.get(0),
            )
            .optional()
            .map_err(storage("loading publication fence"))?;
        let generation = match current {
            Some(value) => u64::try_from(value)
                .ok()
                .and_then(|value| value.checked_add(1))
                .ok_or_else(|| CoreError::PublicationGenerationOverflow {
                    workflow,
                    step_key: step_key.to_owned(),
                })?,
            None => 1,
        };
        let generation_i64 = i64::try_from(generation).map_err(|_| {
            CoreError::PublicationGenerationOverflow {
                workflow,
                step_key: step_key.to_owned(),
            }
        })?;
        tx.execute(
            "INSERT INTO publication_fences (workflow_id, step_key, attempt_id, generation)
             VALUES (?1, ?2, ?3, ?4)
             ON CONFLICT(workflow_id, step_key) DO UPDATE SET
                attempt_id = excluded.attempt_id,
                generation = excluded.generation",
            rusqlite::params![workflow.to_string(), step_key, attempt.to_string(), generation_i64],
        )
        .map_err(storage("advancing publication fence"))?;
        tx.commit()
            .map_err(storage("committing publication fence advance"))?;
        Ok(hub_core::PublicationFence {
            version: hub_core::PUBLICATION_FENCE_VERSION,
            workflow,
            step_key: step_key.to_owned(),
            attempt,
            generation,
        })
    }

    fn current_publication_fence(
        &self,
        workflow: hub_core::WorkflowId,
        step_key: &str,
    ) -> Result<Option<hub_core::PublicationFence>, CoreError> {
        let conn = self.lock()?;
        let row: Option<(String, i64)> = conn
            .query_row(
                "SELECT attempt_id, generation FROM publication_fences WHERE workflow_id = ?1 AND step_key = ?2",
                rusqlite::params![workflow.to_string(), step_key],
                |row| Ok((row.get(0)?, row.get(1)?)),
            )
            .optional()
            .map_err(storage("loading current publication fence"))?;
        row.map(|(attempt, generation)| {
            let attempt = attempt.parse().map_err(|error| {
                CoreError::Storage(format!("stored publication attempt id is invalid: {error}"))
            })?;
            let generation = u64::try_from(generation).map_err(|_| {
                CoreError::Storage("stored publication generation is invalid".into())
            })?;
            let fence = hub_core::PublicationFence {
                version: hub_core::PUBLICATION_FENCE_VERSION,
                workflow,
                step_key: step_key.to_owned(),
                attempt,
                generation,
            };
            fence.validate()?;
            Ok(fence)
        })
        .transpose()
    }

    fn publish_authoritative_artifact(
        &self,
        fence: &hub_core::PublicationFence,
        output_key: &str,
        meta: &ArtifactMeta,
    ) -> Result<hub_core::AuthoritativePublication, CoreError> {
        fence.validate()?;
        hub_core::publication::validate_publication_key(output_key, "output key")?;
        meta.validate()?;
        let mut conn = self.lock()?;
        let tx = conn
            .transaction()
            .map_err(storage("beginning authoritative publication"))?;
        let current: Option<(String, i64)> = tx
            .query_row(
                "SELECT attempt_id, generation FROM publication_fences WHERE workflow_id = ?1 AND step_key = ?2",
                rusqlite::params![fence.workflow.to_string(), fence.step_key],
                |row| Ok((row.get(0)?, row.get(1)?)),
            )
            .optional()
            .map_err(storage("loading publication fence for commit"))?;
        let fence_matches = current.as_ref().is_some_and(|(attempt, generation)| {
            attempt == &fence.attempt.to_string()
                && u64::try_from(*generation).ok() == Some(fence.generation)
        });
        if !fence_matches {
            return Err(CoreError::PublicationFenceStale {
                workflow: fence.workflow,
                step_key: fence.step_key.clone(),
                attempt: fence.attempt,
                generation: fence.generation,
            });
        }
        let generation_i64 = i64::try_from(fence.generation).map_err(|_| {
            CoreError::PublicationGenerationOverflow {
                workflow: fence.workflow,
                step_key: fence.step_key.clone(),
            }
        })?;
        let existing_id: Option<String> = tx
            .query_row(
                "SELECT artifact_id FROM authoritative_publications
                 WHERE workflow_id = ?1 AND step_key = ?2 AND generation = ?3 AND output_key = ?4",
                rusqlite::params![
                    fence.workflow.to_string(),
                    fence.step_key,
                    generation_i64,
                    output_key
                ],
                |row| row.get(0),
            )
            .optional()
            .map_err(storage("loading authoritative publication slot"))?;
        if let Some(existing_id) = existing_id {
            let existing_json: String = tx
                .query_row(
                    "SELECT meta_json FROM artifact_meta WHERE id = ?1",
                    rusqlite::params![existing_id],
                    |row| row.get(0),
                )
                .map_err(storage("loading replay artifact metadata"))?;
            let existing: ArtifactMeta = serde_json::from_str(&existing_json).map_err(|error| {
                CoreError::Storage(format!("stored replay artifact failed to deserialize: {error}"))
            })?;
            if hub_core::publication::replay_equivalent(&existing, meta) {
                return Ok(hub_core::AuthoritativePublication::Replayed(existing.id));
            }
            return Err(CoreError::AuthoritativePublicationConflict {
                workflow: fence.workflow,
                step_key: fence.step_key.clone(),
                generation: fence.generation,
                output_key: output_key.to_owned(),
            });
        }
        let json = serde_json::to_string(meta)
            .map_err(|error| CoreError::Storage(format!("serializing artifact meta: {error}")))?;
        let conflicting_id: Option<String> = tx
            .query_row(
                "SELECT meta_json FROM artifact_meta WHERE id = ?1",
                rusqlite::params![meta.id.to_string()],
                |row| row.get(0),
            )
            .optional()
            .map_err(storage("checking authoritative artifact id"))?;
        if let Some(existing_json) = conflicting_id {
            let existing: ArtifactMeta = serde_json::from_str(&existing_json).map_err(|error| {
                CoreError::Storage(format!("stored authoritative artifact failed to deserialize: {error}"))
            })?;
            if existing != *meta {
                return Err(CoreError::Validation(format!(
                    "artifact {} already exists with divergent metadata",
                    meta.id
                )));
            }
        } else {
            tx.execute(
                "INSERT INTO artifact_meta (id, digest, created_at, meta_json) VALUES (?1, ?2, ?3, ?4)",
                rusqlite::params![meta.id.to_string(), meta.digest.to_hex(), meta.created_at, json],
            )
            .map_err(storage("inserting authoritative artifact meta"))?;
            append_event_tx(&tx, &artifact_recorded_event(meta))?;
        }
        tx.execute(
            "INSERT INTO authoritative_publications
             (workflow_id, step_key, generation, output_key, artifact_id)
             VALUES (?1, ?2, ?3, ?4, ?5)",
            rusqlite::params![
                fence.workflow.to_string(),
                fence.step_key,
                generation_i64,
                output_key,
                meta.id.to_string()
            ],
        )
        .map_err(storage("binding authoritative publication slot"))?;
        tx.commit()
            .map_err(storage("committing authoritative publication"))?;
        Ok(hub_core::AuthoritativePublication::Created(meta.id))
    }
}

