name: One-shot durable publication fence repository

on:
  push:
    branches:
      - industrialize/durable-publication-fence

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: industrialize/durable-publication-fence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Implement durable publication-fence repository contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          publication = r'''//! Durable fencing primitives for authoritative workflow-step publication.
//!
//! The fence is Hub-owned orchestration state. It carries no TDI scientific
//! semantics and grants no capability outside one workflow step attempt.

use serde::{Deserialize, Serialize};

use crate::error::CoreError;
use crate::id::{ArtifactId, AttemptId, WorkflowId};

/// Current publication-fence contract version.
pub const PUBLICATION_FENCE_VERSION: u16 = 1;

/// Durable authority token for one current workflow-step attempt.
#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]
pub struct PublicationFence {
    pub version: u16,
    pub workflow: WorkflowId,
    pub step_key: String,
    pub attempt: AttemptId,
    /// Monotone generation for `(workflow, step_key)`, starting at one.
    pub generation: u64,
}

impl PublicationFence {
    /// Validate interchange shape and bounds.
    ///
    /// # Errors
    /// [`CoreError::Validation`] for unsupported versions or invalid keys.
    pub fn validate(&self) -> Result<(), CoreError> {
        if self.version != PUBLICATION_FENCE_VERSION {
            return Err(CoreError::Validation(format!(
                "unsupported publication fence version {}",
                self.version
            )));
        }
        validate_publication_key(&self.step_key, "step key")?;
        if self.generation == 0 {
            return Err(CoreError::Validation(
                "publication fence generation must be non-zero".into(),
            ));
        }
        Ok(())
    }
}

/// Result of an atomic authoritative artifact publication.
#[derive(Clone, Copy, Debug, PartialEq, Eq)]
pub enum AuthoritativePublication {
    /// New metadata was inserted and bound to the current fence/output slot.
    Created(ArtifactId),
    /// The same logical slot was replayed byte-identically; existing metadata wins.
    Replayed(ArtifactId),
}

/// Validate a short printable publication slot/key.
///
/// # Errors
/// [`CoreError::Validation`] for empty, oversized or control-containing values.
pub fn validate_publication_key(value: &str, label: &str) -> Result<(), CoreError> {
    if value.is_empty()
        || value.len() > 128
        || value.chars().any(|character| character.is_control())
    {
        return Err(CoreError::Validation(format!(
            "publication {label} must be 1..=128 printable characters"
        )));
    }
    Ok(())
}

/// Metadata equality relevant to an idempotent authoritative replay.
///
/// Artifact ids and timestamps are intentionally excluded: a replay may arrive
/// with freshly proposed metadata, but it may only resolve to the first artifact
/// when all logical content/provenance fields are identical.
#[must_use]
pub fn replay_equivalent(
    left: &crate::artifact::ArtifactMeta,
    right: &crate::artifact::ArtifactMeta,
) -> bool {
    left.name == right.name
        && left.media_type == right.media_type
        && left.digest == right.digest
        && left.size == right.size
        && left.produced_by_run == right.produced_by_run
}
'''
          Path('crates/hub-core/src/publication.rs').write_text(publication)

          lib = Path('crates/hub-core/src/lib.rs')
