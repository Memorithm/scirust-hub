          # Add publication state to composite store only. Orchestrator/daemon use this type.\n          old = '''pub struct InMemoryHubStore {\n    components: InMemoryComponents,\n    runs: InMemoryRuns,\n    artifacts: InMemoryArtifactMeta,\n    workflows: InMemoryWorkflows,\n    events: InMemoryLifecycleEvents,\n}\n'''
          new = '''pub struct InMemoryHubStore {\n    components: InMemoryComponents,\n    runs: InMemoryRuns,\n    artifacts: InMemoryArtifactMeta,\n    workflows: InMemoryWorkflows,\n    events: InMemoryLifecycleEvents,\n    publication: Mutex<InMemoryPublicationState>,\n}\n\n#[derive(Debug, Default)]\nstruct InMemoryPublicationState {\n    fences: BTreeMap<(crate::id::WorkflowId, String), crate::publication::PublicationFence>,\n    slots: BTreeMap<(crate::id::WorkflowId, String, u64, String), ArtifactId>,\n}\n'''
          if old not in text:
              raise SystemExit('memory hub store marker not found')
          text = text.replace(old, new, 1)
          marker = '''impl WorkflowRepository for InMemoryHubStore {\n'''
          impl_block = r'''impl PublicationRepository for InMemoryHubStore {
    fn advance_publication_fence(
        &self,
        workflow: crate::id::WorkflowId,
        step_key: &str,
        attempt: crate::id::AttemptId,
    ) -> Result<crate::publication::PublicationFence, CoreError> {
        crate::publication::validate_publication_key(step_key, "step key")?;
        let mut state = self.publication.lock().map_err(poison)?;
        let key = (workflow, step_key.to_owned());
        let generation = state
            .fences
            .get(&key)
            .map_or(Ok(1), |current| {
                current.generation.checked_add(1).ok_or_else(|| {
                    CoreError::PublicationGenerationOverflow {
                        workflow,
                        step_key: step_key.to_owned(),
                    }
                })
            })?;
        let fence = crate::publication::PublicationFence {
            version: crate::publication::PUBLICATION_FENCE_VERSION,
            workflow,
            step_key: step_key.to_owned(),
            attempt,
            generation,
        };
        state.fences.insert(key, fence.clone());
        Ok(fence)
    }

    fn current_publication_fence(
        &self,
        workflow: crate::id::WorkflowId,
        step_key: &str,
    ) -> Result<Option<crate::publication::PublicationFence>, CoreError> {
        let state = self.publication.lock().map_err(poison)?;
        Ok(state
            .fences
            .get(&(workflow, step_key.to_owned()))
            .cloned())
    }

    fn publish_authoritative_artifact(
        &self,
        fence: &crate::publication::PublicationFence,
        output_key: &str,
        meta: &ArtifactMeta,
    ) -> Result<crate::publication::AuthoritativePublication, CoreError> {
        fence.validate()?;
        crate::publication::validate_publication_key(output_key, "output key")?;
        meta.validate()?;
        let mut state = self.publication.lock().map_err(poison)?;
        let fence_key = (fence.workflow, fence.step_key.clone());
        if state.fences.get(&fence_key) != Some(fence) {
            return Err(CoreError::PublicationFenceStale {
                workflow: fence.workflow,
                step_key: fence.step_key.clone(),
                attempt: fence.attempt,
                generation: fence.generation,
            });
        }
        let slot_key = (
            fence.workflow,
            fence.step_key.clone(),
            fence.generation,
            output_key.to_owned(),
        );
        if let Some(existing_id) = state.slots.get(&slot_key).copied() {
            let existing = ArtifactMetadataRepository::get(&self.artifacts, &existing_id)?
                .ok_or_else(|| CoreError::Storage("publication slot references missing artifact".into()))?;
            if crate::publication::replay_equivalent(&existing, meta) {
                return Ok(crate::publication::AuthoritativePublication::Replayed(existing_id));
            }
            return Err(CoreError::AuthoritativePublicationConflict {
                workflow: fence.workflow,
                step_key: fence.step_key.clone(),
                generation: fence.generation,
                output_key: output_key.to_owned(),
            });
        }
        let existed = ArtifactMetadataRepository::get(&self.artifacts, &meta.id)?.is_some();
        ArtifactMetadataRepository::put(&self.artifacts, meta)?;
        if !existed {
            self.events.record(artifact_recorded_event(meta))?;
        }
        state.slots.insert(slot_key, meta.id);
        Ok(crate::publication::AuthoritativePublication::Created(meta.id))
    }
}

'''
          if marker not in text:
              raise SystemExit('memory workflow impl marker not found')
          text = text.replace(marker, impl_block + marker, 1)
          memory.write_text(text)

          sqlite = Path('crates/hub-store-sqlite/src/lib.rs')
