    #[test]
    fn publication_fences_are_durable_monotone_and_fail_closed() {
        let dir = std::env::temp_dir().join(format!("hub-sqlite-fence-{}", uuid::Uuid::new_v4()));
        std::fs::create_dir_all(&dir).expect("mkdir");
        let db = dir.join("hub.db");
        let workflow = hub_core::WorkflowId::generate();
        let first_attempt = hub_core::AttemptId::generate();
        let first = {
            let store = SqliteStore::open(&db).expect("open");
            let first = store
                .advance_publication_fence(workflow, "fit", first_attempt)
                .expect("first fence");
            assert_eq!(first.generation, 1);
            first
        };
        let store = SqliteStore::open(&db).expect("reopen");
        assert_eq!(
            store
                .current_publication_fence(workflow, "fit")
                .expect("current"),
            Some(first.clone())
        );
        let second = store
            .advance_publication_fence(workflow, "fit", hub_core::AttemptId::generate())
            .expect("second fence");
        assert_eq!(second.generation, 2);

        let meta = ArtifactMeta {
            id: hub_core::ArtifactId::generate(),
            name: "result".into(),
            media_type: "application/octet-stream".into(),
            digest: hub_core::digest::hash_bytes(hub_core::digest::DOMAIN_ARTIFACT_BLOB, b"x"),
            size: 1,
            created_at: 10,
            produced_by_run: Some(hub_core::RunId::generate()),
        };
        assert!(matches!(
            store.publish_authoritative_artifact(&first, "file:result", &meta),
            Err(CoreError::PublicationFenceStale { .. })
        ));
        assert_eq!(
            store
                .publish_authoritative_artifact(&second, "file:result", &meta)
                .expect("publish"),
            AuthoritativePublication::Created(meta.id)
        );
        let replay = ArtifactMeta {
            id: hub_core::ArtifactId::generate(),
            created_at: 99,
            ..meta.clone()
        };
        assert_eq!(
            store
                .publish_authoritative_artifact(&second, "file:result", &replay)
                .expect("replay"),
            AuthoritativePublication::Replayed(meta.id)
        );
        let conflict = ArtifactMeta {
            digest: hub_core::digest::hash_bytes(hub_core::digest::DOMAIN_ARTIFACT_BLOB, b"y"),
            ..replay
        };
        assert!(matches!(
            store.publish_authoritative_artifact(&second, "file:result", &conflict),
            Err(CoreError::AuthoritativePublicationConflict { .. })
        ));

        let independent = store
