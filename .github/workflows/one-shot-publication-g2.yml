name: One-shot publication G2 integration

on:
  push:
    branches:
      - industrialize/publication-orchestrator-g2

permissions:
  contents: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Patch Hub-owned authoritative publication boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          p = Path("crates/hub-core/src/orchestrator.rs")
          text = p.read_text()

          text = replace_once(
              text,
              "use crate::memory::FileSystemArtifactStore;\nuse crate::run::{OutputRef, RunOutcome, RunRecord, RunSpec, RunState};",
              "use crate::memory::FileSystemArtifactStore;\nuse crate::publication::{\n    AuthoritativeStepPublication, InMemoryPublicationFences, PublicationFenceRepository,\n};\nuse crate::run::{OutputRef, RunOutcome, RunRecord, RunSpec, RunState};",
              "publication imports",
          )

          text = replace_once(
              text,
              "    workflows: Arc<dyn WorkflowRepository>,\n    executor: Arc<dyn Executor>,",
              "    workflows: Arc<dyn WorkflowRepository>,\n    publication_fences: Arc<dyn PublicationFenceRepository>,\n    executor: Arc<dyn Executor>,",
              "orchestrator publication field",
          )

          old_ctor = '''    pub fn new(
        clock: Arc<dyn Clock>,
        components: Arc<dyn ComponentRepository>,
        runs: Arc<dyn RunRepository>,
        artifacts_meta: Arc<dyn ArtifactMetadataRepository>,
        workflows: Arc<dyn WorkflowRepository>,
        blobs: FileSystemArtifactStore,
        executor: Arc<dyn Executor>,
        limits: Limits,
        workdir_root: impl Into<PathBuf>,
    ) -> Self {
        Self {
            clock,
            components,
            runs,
            artifacts_meta,
            workflows,
            blobs,
            executor,
            limits,
            workdir_root: workdir_root.into(),
            active_cancels: Mutex::new(BTreeMap::new()),
            active_workflow_cancels: Mutex::new(BTreeMap::new()),
            active_workflow_runs: Mutex::new(BTreeMap::new()),
        }
    }
'''
          new_ctor = '''    pub fn new(
        clock: Arc<dyn Clock>,
        components: Arc<dyn ComponentRepository>,
        runs: Arc<dyn RunRepository>,
        artifacts_meta: Arc<dyn ArtifactMetadataRepository>,
        workflows: Arc<dyn WorkflowRepository>,
        blobs: FileSystemArtifactStore,
        executor: Arc<dyn Executor>,
        limits: Limits,
        workdir_root: impl Into<PathBuf>,
    ) -> Self {
        Self::new_with_publication_fences(
            clock,
            components,
            runs,
            artifacts_meta,
            workflows,
            Arc::new(InMemoryPublicationFences::default()),
            blobs,
            executor,
            limits,
            workdir_root,
        )
    }

    /// Assembles an orchestrator with an explicit workflow publication authority.
    /// Durable deployments must inject the same durable store that owns workflow
    /// attempt state so fenced publication survives restart.
    #[must_use]
    #[allow(clippy::too_many_arguments)] // one argument per injected port
    pub fn new_with_publication_fences(
        clock: Arc<dyn Clock>,
        components: Arc<dyn ComponentRepository>,
        runs: Arc<dyn RunRepository>,
        artifacts_meta: Arc<dyn ArtifactMetadataRepository>,
        workflows: Arc<dyn WorkflowRepository>,
        publication_fences: Arc<dyn PublicationFenceRepository>,
        blobs: FileSystemArtifactStore,
        executor: Arc<dyn Executor>,
        limits: Limits,
        workdir_root: impl Into<PathBuf>,
    ) -> Self {
        Self {
            clock,
            components,
            runs,
            artifacts_meta,
            workflows,
            publication_fences,
            blobs,
            executor,
            limits,
            workdir_root: workdir_root.into(),
            active_cancels: Mutex::new(BTreeMap::new()),
            active_workflow_cancels: Mutex::new(BTreeMap::new()),
            active_workflow_runs: Mutex::new(BTreeMap::new()),
        }
    }
'''
          text = replace_once(text, old_ctor, new_ctor, "orchestrator constructors")

          old_attempt = '''            let submitted = self.submit_run(run_spec.clone())?;
            {
                let mut record = lock_workflow_record(shared_record)?;
                let attempt = crate::workflow::StepAttempt {
                    id: AttemptId::generate(),
                    number: attempt_number,
                    run: submitted.id,
                    state: submitted.state,
                    started_at: submitted.started_at,
                    finished_at: submitted.finished_at,
                    failure_category: None,
                    failure: None,
                };
                Self::record_attempt(&mut record, &step.key, attempt);
                self.workflows.put(&record)?;
            }

            self.register_active_workflow_run(workflow_id, submitted.id)?;
'''
          new_attempt = '''            let submitted = self.submit_run(run_spec.clone())?;
            let attempt_id = AttemptId::generate();
            {
                let mut record = lock_workflow_record(shared_record)?;
                let attempt = crate::workflow::StepAttempt {
                    id: attempt_id,
                    number: attempt_number,
                    run: submitted.id,
                    state: submitted.state,
                    started_at: submitted.started_at,
                    finished_at: submitted.finished_at,
                    failure_category: None,
                    failure: None,
                };
                Self::record_attempt(&mut record, &step.key, attempt);
                self.workflows.put(&record)?;
            }
            // Fence issuance follows the persisted attempt snapshot. A crash
            // between these operations leaves no authoritative publication and
            // therefore fails closed on restart rather than granting stale
            // authority.
            let publication_fence = self.publication_fences.advance_publication_fence(
                workflow_id,
                &step.key,
                attempt_id,
            )?;

            self.register_active_workflow_run(workflow_id, submitted.id)?;
'''
          text = replace_once(text, old_attempt, new_attempt, "workflow attempt fence issuance")

          old_success = '''            if finished.state == RunState::Succeeded {
                return Ok(ParallelStepTerminal::Succeeded);
            }
'''
          new_success = '''            if finished.state == RunState::Succeeded {
                let publication = AuthoritativeStepPublication {
                    fence: publication_fence,
                    outputs: authoritative_output_map(&finished)?,
                };
                self.publication_fences
                    .publish_authoritative_outputs(&publication)?;
                return Ok(ParallelStepTerminal::Succeeded);
            }
'''
          text = replace_once(text, old_success, new_success, "authoritative success publication")

          old_resolve = '''                crate::workflow::InputSource::FromStep { key: dep, output } => {
                    let produced = record.steps.iter().find(|result| &result.key == dep);
                    let Some(dep_run) = produced.map(|result| result.run) else {
                        return Ok(Err(format!(
                            "step {:?} input {input_name:?}: dependency {dep:?} has not run",
                            step.key
                        )));
                    };
                    let dep_record = self.runs.get(&dep_run)?;
                    let artifact = dep_record.as_ref().and_then(|run| {
                        run.outcome.as_ref().and_then(|outcome| {
                            outcome
                                .outputs
                                .iter()
                                .find(|candidate| &candidate.name == output)
                                .map(|candidate| candidate.artifact)
                        })
                    });
                    if let Some(artifact) = artifact {
                        resolved.insert(input_name.clone(), artifact);
                    } else {
                        return Ok(Err(format!(
                            "step {:?} input {input_name:?}: step {dep:?} produced no output named {output:?}",
                            step.key
                        )));
                    }
                }
'''
          new_resolve = '''                crate::workflow::InputSource::FromStep { key: dep, output } => {
                    let publication = self
                        .publication_fences
                        .authoritative_publication(record.id, dep)?;
                    let artifact = publication
                        .as_ref()
                        .and_then(|published| published.outputs.get(output))
                        .copied();
                    if let Some(artifact) = artifact {
                        resolved.insert(input_name.clone(), artifact);
                    } else {
                        return Ok(Err(format!(
                            "step {:?} input {input_name:?}: step {dep:?} has no authoritative published output named {output:?}",
                            step.key
                        )));
                    }
                }
'''
          text = replace_once(text, old_resolve, new_resolve, "authoritative downstream resolution")

          marker = '''fn classify_attempt_failure(run: &RunRecord) -> Option<crate::workflow::AttemptFailureCategory> {
'''
          helper = '''fn authoritative_output_map(
    run: &RunRecord,
) -> Result<BTreeMap<String, ArtifactId>, CoreError> {
    let outcome = run.outcome.as_ref().ok_or_else(|| {
        CoreError::Storage(format!(
            "successful run {} has no terminal outcome to publish",
            run.id
        ))
    })?;
    let mut outputs = BTreeMap::new();
    for output in &outcome.outputs {
        if outputs.insert(output.name.clone(), output.artifact).is_some() {
            return Err(CoreError::Validation(format!(
                "run {} produced duplicate output label {:?}; authoritative publication is ambiguous",
                run.id, output.name
            )));
        }
    }
    Ok(outputs)
}

'''
          text = replace_once(text, marker, helper + marker, "publication output helper")
          p.write_text(text)

          p = Path("apps/scirust-hubd/src/main.rs")
          text = p.read_text()
          text = replace_once(
              text,
              "use hub_core::memory::{FileSystemArtifactStore, InMemoryHubStore};\nuse hub_core::store::{",
              "use hub_core::memory::{FileSystemArtifactStore, InMemoryHubStore};\nuse hub_core::publication::{InMemoryPublicationFences, PublicationFenceRepository};\nuse hub_core::store::{",
              "daemon publication imports",
          )
          text = replace_once(
              text,
              "    workflows: Arc<dyn WorkflowRepository>,\n    blob_store: FileSystemArtifactStore,",
              "    workflows: Arc<dyn WorkflowRepository>,\n    publication_fences: Arc<dyn PublicationFenceRepository>,\n    blob_store: FileSystemArtifactStore,",
              "daemon build signature",
          )
          text = replace_once(
              text,
              "    Arc::new(Orchestrator::new(\n        Arc::new(SystemClock),\n        components,\n        runs,\n        artifacts_meta,\n        workflows,\n        blob_store,",
              "    Arc::new(Orchestrator::new_with_publication_fences(\n        Arc::new(SystemClock),\n        components,\n        runs,\n        artifacts_meta,\n        workflows,\n        publication_fences,\n        blob_store,",
              "daemon durable constructor",
          )
          sqlite_old = '''                    store.clone(),
                    store.clone(),
                    store.clone(),
                    store.clone(),
                    blob_store,
'''
          sqlite_new = '''                    store.clone(),
                    store.clone(),
                    store.clone(),
                    store.clone(),
                    store.clone(),
                    blob_store,
'''
          text = replace_once(text, sqlite_old, sqlite_new, "sqlite publication port")
          memory_old = '''                    store.clone(),
                    store.clone(),
                    store.clone(),
                    store.clone(),
                    blob_store,
                    executor.clone(),
                    workdir_root,
                );
                (orchestrator, store)
            }
'''
          memory_new = '''                    store.clone(),
                    store.clone(),
                    store.clone(),
                    store.clone(),
                    Arc::new(InMemoryPublicationFences::default()),
                    blob_store,
                    executor.clone(),
                    workdir_root,
                );
                (orchestrator, store)
            }
'''
          text = replace_once(text, memory_old, memory_new, "memory publication port")
          p.write_text(text)
          PY

      - name: Remove one-shot workflow from proposed tree
        run: rm .github/workflows/one-shot-publication-g2.yml
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt clippy
      - name: Format
        run: cargo +1.89.0 fmt --all
      - name: Hub core publication contract tests
        run: cargo +1.89.0 test -p hub-core
      - name: Durable store publication tests
        run: cargo +1.89.0 test -p hub-store-sqlite
      - name: Daemon tests
        run: cargo +1.89.0 test -p scirust-hubd
      - name: Clippy changed surfaces
        run: cargo +1.89.0 clippy -p hub-core -p hub-store-sqlite -p scirust-hubd --all-targets -- -D warnings
      - name: Commit qualified patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "ZEKRITI TAREK"
          git config user.email "contact@checkupauto.fr"
          git add crates/hub-core/src/orchestrator.rs apps/scirust-hubd/src/main.rs .github/workflows/one-shot-publication-g2.yml
          git commit -m "feat(publication): enforce fences in workflow orchestration"
          git push origin HEAD:industrialize/publication-orchestrator-g2
