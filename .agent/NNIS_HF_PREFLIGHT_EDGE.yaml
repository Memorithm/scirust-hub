open_cross_repository_gap:
  status: explicit
  description: >-
    Hub can now preflight an already-compatible deterministic local-HF model
    bundle, but the current SOUP llm.train capability emits a training/adaptor
    model bundle and must not be assumed to satisfy NNIS direct execution.
    The currently qualified NNIS SOUP path requires a dense merged F32 local
    Hugging Face artifact. A separately versioned SOUP-owned merge producer edge
    is still required for an end-to-end Hub SOUP-to-NNIS workflow.
  next: >-
    Audit the current upstream SOUP merge CLI and the Hub SOUP adapter against
    the real current commits, then publish the narrowest artifact-producing
    merge capability that preserves SOUP merge semantics and outputs the existing
    deterministic Hub model bundle for NNIS preflight consumption.
