schema_version: 1
kind: memorithm_ml_maturity_program
status: active
last_updated: "2026-09-04"
repository: Memorithm/scirust-hub
objective: >-
  Raise the ML orchestration/control-plane contribution to evidence-backed 5/5:
  Hub must schedule and reproduce real ML runs across heterogeneous workers and
  immutable model/data/evidence artifacts without becoming the tensor, training,
  inference or optimization runtime.
score_policy:
  five_of_five_requires:
    - versioned_ML_component_capabilities_and_resource_requirements
    - durable_restart_safe_multi_worker_execution
    - immutable_model_dataset_checkpoint_and_evidence_artifact_identity
    - resource_aware_placement_and_explicit_failure_semantics
    - exact_head_required_CI_green
  forbidden:
    - implementing_DDP_or_model_execution_inside_Hub
    - scheduling_on_unverified_capabilities
    - silently_replaying_ambiguous_side_effecting_training_attempts
verified_slices:
  - id: SOUP_HML0_resource_declaration_v1
    status: complete
    pull_request: 28
    final_exact_head: 50acbc69fabf657e75a7dc25f4bf40b25470777c
    merge_commit: 3317300d33cfb412f90dede64257833d3e8cdfd2
    contract: hub.ml.resource-requirements@1.0.0
    scope: >-
      SOUP train/eval/export publish backend, device, dtype, accelerator and
      memory resolution semantics while explicitly leaving compatible-worker
      placement to HML1.
  - id: SOUP_Elastic_preexecution_resource_plan_handoff_v1
    status: complete
    pull_request: 30
    final_exact_head: f4a8336622a8383f1a7df3610e87d200356e1ddb
    merge_commit: 66fcd61a8b7d8ad39425b1725b94919f5abc210f
    capability: llm.train.elastic@1.0.0
    elastic_contract: elastic.soup.run-resource-plan@1.0.0
    elastic_media_type: application/vnd.elastic.soup.run-resource-plan.v1+json
    elastic_source_merge: 6e0952e59842eb9c14f808266d6f3eb0b1f33014
    scope: >-
      Hub accepts an immutable, versioned ElasticXxx pre-execution resource-plan
      artifact for SOUP training, revalidates its wire boundary, and materializes
      only explicit config-template seams before SOUP performs its own runtime
      validation. This does not establish HML1 worker-resource discovery or
      dynamic compatible placement and does not run Elastic policy inside Hub.
  - id: SOUP_SciRust_symbolic_reward_edge_v1
    status: complete
    pull_request: 31
    final_exact_head: 76fd1571aa8d2189d540e47e8b58dd3d6a48a0d8
    merge_commit: ee9df7306ef2573e350c55cd14bf85ea3cbbd841
    capability: llm.train.scirust_symbolic@1.0.0
    scirust_source_head: 58d850899cee1d62449cc02816b787b7f8a8a3de
    scirust_source_merge: f6bdadb6234129e14e9ea4d69f46901c6dcecbd0
    scirust_schema_version: 1
    scirust_kind: symbolic_equivalence
    scope: >-
      Hub exposes a separate SOUP GRPO capability wired to the qualified SciRust
      symbolic-equivalence reward process, fixes the trusted bridge and binary
      deployment paths, and records exact SciRust reward provenance. This does
      not make SciRust a SOUP or PyTorch training backend, does not turn a
      not_proven reward into an inequality verdict, and does not establish HML1
      resource-aware placement or HML4 qualification-campaign maturity.
  - id: SOUP_HML3_streamed_bundle_lineage_v1
    status: complete
    artifact_streaming_pull_request: 27
    artifact_streaming_final_exact_head: d2b9c57d4dafcfe530424ef075324608da5e17da
    artifact_streaming_merge_commit: b20b2f66ae8c82f996590d65500c4aff950b3423
    contracts_pull_request: 28
    contracts_final_exact_head: 50acbc69fabf657e75a7dc25f4bf40b25470777c
    contracts_merge_commit: 3317300d33cfb412f90dede64257833d3e8cdfd2
    scope: >-
      Declared ML outputs stream into content-addressed storage and SOUP
      directory-shaped model/export outputs are normalized into deterministic,
      bounded, fail-closed bundle artifacts. Full generic optimizer/checkpoint
      graph semantics remain future HML3 work.
priority_program:
  - id: HML0
    name: ML capability schema
    priority: P0
    status: active_with_SOUP_Elastic_and_SciRust_reward_reference_contracts
    goals:
      - register_training_inference_benchmark_and_verification_capabilities_with_versioned_ports
      - express_device_dtype_memory_accelerator_and_backend_requirements
      - keep_capability_discovery_distinct_from_execution_success
  - id: HML1
    name: Resource aware worker pool
    priority: P0
    status: planned
    goals:
      - dynamic_worker_registration_lease_expiry_and_liveness
      - advertise_CPU_GPU_memory_driver_and_runtime_capabilities
      - deterministic_resource_aware_placement_with_bounded_parallelism
      - preserve_worker_identity_and_attempt_identity_across_retries
  - id: HML2
    name: Distributed ML orchestration
    priority: P1
    status: planned
    goals:
      - orchestrate_multi_process_or_multi_host_training_components_without_implementing_collectives
      - allocate_coherent_worker_groups_and_publish_rendezvous_inputs_as_explicit_artifacts_or_parameters
      - cancel_fail_fast_and_recover_workflow_state_without_duplicate_side_effects
  - id: HML3
    name: Model data checkpoint artifact lineage
    priority: P0
    status: active_with_SOUP_bundle_v1_reference_contract
    goals:
      - support_large_immutable_artifact_metadata_and_content_addressed_identity
      - preserve_model_config_tokenizer_weights_dataset_manifest_checkpoint_and_optimizer_lineage
      - link_reproduction_runs_without_rewriting_original_provenance
  - id: HML4
    name: Qualification campaign orchestration
    priority: P0
    status: planned
    goals:
      - run_same_workload_SciRust_Burn_Candle_PyTorch_comparison_components_when_registered
      - collect_machine_readable_outputs_without_reinterpreting_measurement_semantics
      - hand_evidence_to_SciRust_Verify_for_verdicts
completion_definition: >-
  Hub is 5/5 for ML when heterogeneous worker resources can be discovered and
  safely allocated to real training/inference/benchmark workflows, all model and
  checkpoint lineage is immutable and reproducible, and verification remains
  delegated to the appropriate evidence layer.
