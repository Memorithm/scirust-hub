schema_version: 1
kind: scirust_hub_ecosystem_agent_roadmap
status: active
last_updated: "2026-09-03"
repository: Memorithm/scirust-hub
intended_consumer: autonomous_coding_agent
merge_policy: never_merge_this_file_to_default_branch_unless_user_explicitly_requests

mission:
  primary: >-
    Evolve SciRust Hub as the registry, orchestration, artifact, provenance, and
    execution control plane of the Memorithm ecosystem without absorbing the
    scientific, runtime, search, verification, or packaging semantics of the
    components it coordinates.
  ecosystem_goal: >-
    Provide a versioned graph of discoverable component capabilities and safe
    orchestration contracts so autonomous agents can compose ecosystem products
    while preserving ownership boundaries, exact artifact identity, provenance,
    cancellation/retry semantics, and fail-closed execution behavior.

verified_current_facts:
  - Hub_registers_ecosystem_components_and_capabilities
  - Hub_has_durable_SQLite_metadata_and_append_only_lifecycle_events
  - Hub_supports_local_and_authenticated_remote_process_execution
  - workflows_support_bounded_parallelism_retries_and_cancellation
  - SciCapsule_execution_is_integrated_through_a_published_versioned_process_contract
  - SOUP_offline_ship_evidence_replay_is_integrated_through_llm_ship_1_0_0
  - Hub_records_immutable_artifacts_and_execution_provenance
  - Hub_has_read_only_MCP_introspection
  - Hub_has_bearer_authentication_and_optional_native_TLS
  - Hub_has_static_control_plane_principals_with_explicit_inspect_control_and_metrics_permissions
  - Hub_distinguishes_unauthorized_401_from_authenticated_forbidden_403
  - legacy_SCIRUST_HUB_TOKEN_mode_remains_backward_compatible_full_control
  - process_execution_is_supervised_but_not_an_OS_sandbox
  - current_BOUNDARIES_md_contains_historical_not_yet_established_notes_that_must_be_reconciled_against_newer_published_contracts_before_relying_on_them

invariants:
  - Hub_coordinates_products_but_does_not_absorb_their_domain_implementation
  - registration_never_executes_component_code
  - component_and_protocol_contracts_are_versioned_and_fail_closed_on_unknown_shapes
  - immutable_artifacts_and_authoritative_metadata_are_not_rewritten_to_fake_reproduction
  - retries_get_fresh_attempt_and_run_identity
  - ambiguous_post_dispatch_side_effecting_failures_are_not_blindly_replayed_elsewhere
  - restart_behavior_must_not_silently_repeat_side_effecting_work
  - authentication_is_not_equated_with_authorization_or_sandboxing
  - transport_principal_identity_is_not_retroactively_invented_for_historical_core_events
  - required_CI_must_be_green_on_exact_PR_head_before_merge

ownership:
  role: ecosystem_control_plane
  owns:
    - component_registry_and_capability_discovery
    - component_manifest_validation_and_identity
    - run_and_workflow_lifecycle
    - executor_abstraction_and_worker_placement
    - artifact_metadata_blob_flow_and_orchestration_provenance
    - lifecycle_event_stream
    - Hub_HTTP_CLI_and_read_only_MCP_interfaces
    - ecosystem_component_contract_registry_at_the_control_plane_boundary
  does_not_own:
    - SciRust_scientific_tensor_algorithm_or_autodiff_implementation
    - SciCapsule_scicap_format_trust_policy_or_capsule_execution_semantics
    - SciRust_Verify_evidence_dossier_claim_evaluation_or_verdict_semantics
    - Forge_candidate_search_strategy
    - ElasticXxx_adaptive_resource_control_loop
    - FLAT_ATTENTION_attention_kernel_semantics
    - NNIS_native_inference_runtime_internals
    - SLHAv2_compressed_KV_semantics
    - SOUP_training_evaluation_model_loading_or_verdict_semantics
    - nonlocal_relativity_scientific_models_or_interpretation

ecosystem_graph:
  substrate:
    Memorithm/scirust:
      role: scientific_numerical_tensor_and_shared_primitive_substrate
  adaptive_control:
    Memorithm/ElasticXxx:
      role: generic_resource_observe_plan_validate_act_verify_commit_or_rollback_runtime
  specialized_runtime_and_algorithms:
    Memorithm/NVIDIA-Native-Inference-Stack:
      role: native_NVIDIA_model_runtime
    Memorithm/FLAT-ATTENTION:
      role: fused_attention_engine
    Memorithm/SLHAv2:
      role: compressed_KV_cache_and_real_model_integration_product
  optimization_search:
    Memorithm/forge:
      role: execution_driven_candidate_search_engine
  llm_post_training:
    MakazhanAlpamys/Soup:
      role: independent_LLM_post_training_evaluation_and_export_product
  verification:
    Memorithm/SciRust-Verify:
      role: evidence_dossier_integrity_scope_and_verdict_layer
  portable_execution:
    Memorithm/SciCapsule:
      role: portable_reproducible_capsule_product_and_trusted_bounded_execution_contract
  research_incubation:
    Memorithm/nonlocal-relativity-v2:
      role: relativity_and_nonlocal_relativity_research_incubator_and_evidence_source
  control_plane:
    Memorithm/scirust-hub:
      role: registry_orchestration_artifact_and_provenance_control_plane

contract_policy:
  rules:
    - no_edge_in_the_ecosystem_graph_exists_operationally_until_a_versioned_contract_is_published_and_tested
    - conceptual_relationships_must_not_be_treated_as_wire_contracts
    - Hub_adapters_validate_known_contract_versions_but_do_not_reimplement_component_semantics
    - every_component_run_records_component_version_input_artifact_identity_and_execution_provenance
    - cross_component_workflows_pass_immutable_artifacts_or_explicit_typed_parameters_not_hidden_shared_state

current_and_target_interfaces:
  Memorithm/SciCapsule:
    status: active_published_contract
    capability: capsule.execute
    rule: Hub_materializes_inputs_and_owns_outer_orchestration_while_SciCapsule_validates_trust_and_executes_the_capsule
  MakazhanAlpamys/Soup:
    status: active_published_contract
    capability: llm.ship
    contract_version: 1.0.0
    source_release: v0.73.3
    reviewed_upstream_main: 2137035bc6279b32fc7c1e04e1c70aec3584290a
    hub_pull_request: 26
    final_exact_head: a01464ae51f17dfa513bce902e9db5a1f5732abf
    merge_commit: 87546e00c0ae255b47013182d97e06db43a24721
    required_CI: CI_success_on_final_exact_head
    rule: >-
      Hub preserves SOUP offline SHIP and DONT_SHIP verdict artifacts through a
      narrow process adapter without absorbing SOUP evaluation semantics.
    next_contract_blockers:
      - large_and_directory_artifact_lineage_for_models_adapters_and_checkpoints
      - versioned_ML_device_dtype_memory_and_backend_requirements
      - measured_SciRust_interoperability_before_any_acceleration_claim
  Memorithm/scirust:
    status: contract_inventory_needed
    desired:
      - publish_selected_process_or_service_capabilities_without_putting_Hub_logic_in_SciRust_core
  Memorithm/SciRust-Verify:
    status: planned
    desired:
      - run_or_ingest_verification_components
      - retain_dossier_as_immutable_artifact
      - keep_Verify_verdict_semantics_outside_Hub
  Memorithm/ElasticXxx:
    status: planned
    desired:
      - orchestrate_Elastic_runtime_jobs_or_daemons
      - retain_plan_cycle_and_evidence_artifacts
      - never_move_Elastic_adaptation_policy_into_Hub_scheduler
  Memorithm/forge:
    status: planned
    desired:
      - orchestrate_campaigns_or_workers_through_published_component_contracts
      - preserve_Forge_campaign_identity_and_search_semantics
  Memorithm/FLAT-ATTENTION:
    status: planned
    desired:
      - register_benchmark_or_attention_execution_capabilities_when_a_stable_contract_exists
  Memorithm/NVIDIA-Native-Inference-Stack:
    status: planned
    desired:
      - register_model_runtime_or_benchmark_capabilities_when_their_process_contract_is_stable
  Memorithm/SLHAv2:
    status: planned
    desired:
      - register_real_model_baseline_vs_SLHA_benchmark_or_runtime_capabilities
  Memorithm/nonlocal-relativity-v2:
    status: planned
    desired:
      - orchestrate_deterministic_experiments_without_interpreting_scientific_results

roadmap:
  - id: HUB0
    name: Reconcile architecture boundaries with current contracts
    status: active
    goals:
      - audit_README_BOUNDARIES_ADRs_and_current_code_against_each_other
      - update_stale_not_yet_established_notes_only_from_verified_current_contracts
      - publish_one_authoritative_component_ownership_matrix
  - id: HUB1
    name: Strong execution identity and durability
    status: active
    goals:
      - harden_run_attempt_worker_and_artifact_identity
      - preserve_restart_safe_fail_closed_semantics
      - strengthen_duplicate_retry_and_ambiguous_failure_handling
      - keep_lifecycle_events_transactionally_linked_to_authoritative_mutations
  - id: HUB2
    name: Authorization and worker trust
    status: active_worker_trust_next
    completed_slices:
      - id: HUB2_static_control_plane_principals
        status: complete
        issue: 24
        pull_request: 25
        final_exact_head: 5597ceabe04b91a385db3a746c594e2f73705cb4
        merge_commit: d5a1703aa8aeeed3094058e49b34b91cab7cadf0
        required_CI: CI_success_on_final_exact_head
        guarantees:
          - explicit_non_secret_principal_identity_at_HTTP_control_plane_boundary
          - strict_inspect_control_metrics_permission_vocabulary
          - legacy_single_token_full_control_compatibility
          - fail_closed_versioned_multi_principal_configuration
          - unauthorized_401_distinct_from_authenticated_forbidden_403
          - all_current_mutation_categories_covered_by_read_only_403_tests
          - health_and_ready_remain_unauthenticated_and_metrics_permission_is_explicit
          - principal_spoof_headers_do_not_elevate_authority
          - core_lifecycle_history_is_not_rewritten_with_invented_actor_identity
    remaining_goals:
      - evaluate_mTLS_or_equivalent_worker_identity_without_weakening_existing_TLS_validation
      - define_worker_authorization_separately_from_control_plane_principals
      - distinguish_transport_authentication_authorization_and_execution_isolation
      - keep_MCP_read_only_until_agent_mutation_authorization_is_separately_reviewed
  - id: HUB3
    name: Dynamic resource-aware worker plane
    status: planned
    goals:
      - dynamic_worker_registration_and_expiry
      - versioned_worker_capability_and_resource_descriptors
      - deterministic_resource_aware_placement
      - drain_health_and_lease_state_integration
      - no_scheduler_policy_that_silently_overrides_component_invariants
  - id: HUB4
    name: Ecosystem component contract catalog
    status: active
    completed_slices:
      - id: HUB4_SOUP_offline_ship_v1
        status: complete
        capability: llm.ship
        contract_version: 1.0.0
        pull_request: 26
        final_exact_head: a01464ae51f17dfa513bce902e9db5a1f5732abf
        merge_commit: 87546e00c0ae255b47013182d97e06db43a24721
        required_CI: CI_success_on_final_exact_head
        guarantees:
          - SHIP_and_DONT_SHIP_are_preserved_as_semantic_verdict_artifacts
          - SOUP_runtime_usage_signal_and_unknown_exits_fail_closed
          - adapter_does_not_reinterpret_SOUP_verdict_payloads
          - input_and_output_symlinks_are_rejected_at_the_SOUP_adapter_boundary
          - manifest_is_validated_by_Hub_ComponentManifest
    sequence:
      - preserve_and_version_SciCapsule_contract
      - define_SciRust_selected_capabilities
      - define_SciRust_Verify_contract
      - define_ElasticXxx_contract
      - define_Forge_contract
      - define_SLHAv2_FLAT_and_NNIS_contracts_as_their_surfaces_stabilize
      - define_nonlocal_relativity_experiment_contract
      - expand_SOUP_beyond_llm_ship_only_after_HML0_and_HML3_contracts_exist
    exit_criteria:
      - each_active_edge_has_schema_version_compatibility_tests_and_failure_semantics
  - id: HUB5
    name: Cross-product provenance graph
    status: planned_after_HUB4
    goals:
      - link_runs_artifacts_verification_dossiers_elastic_plans_search_campaigns_and_capsule_identity_without_flattening_semantics
      - expose_queryable_lineage_across_workflows
      - preserve_source_component_authority_for_each_evidence_type
  - id: HUB6
    name: Portable reproducible workflows
    status: planned
    goals:
      - compose_SciCapsule_packaged_inputs_with_Hub_workflows
      - invoke_Verify_for_scoped_evidence
      - orchestrate_Elastic_or_Forge_when_explicitly_requested
      - reproduce_workflows_from_immutable_specs_without_silent_side_effect_replay
  - id: HUB7
    name: Agent-safe ecosystem control surface
    status: planned_after_authorization
    goals:
      - expand_MCP_or_agent_API_from_read_only_only_after_explicit_authorization_model_exists
      - expose_plan_preview_and_dry_run_for_mutating_operations
      - make_every_agent_mutation_auditable_and_attributable
      - preserve_human_and_policy_approval_points_for_high_impact_operations
  - id: HUB8
    name: Stable control-plane productization
    status: long_term
    goals:
      - stable_API_protocol_and_manifest_versioning
      - semver_MSRV_and_migration_policy
      - backup_restore_and_operational_recovery_guides
      - compatibility_matrix_for_registered_ecosystem_products

agent_operating_protocol:
  must_read_this_file:
    - at_start_of_every_agent_session
    - before_adding_or_changing_any_component_contract
    - before_global_scheduler_authentication_or_provenance_changes
    - before_cross_repository_or_merge_decisions
  must_update_this_file:
    - when_a_component_contract_is_published_changed_or_removed
    - when_ecosystem_ownership_changes
    - when_worker_trust_or_authorization_model_changes
    - when_roadmap_phase_status_changes
  fail_closed: >-
    If this roadmap cannot be read, do not make major control-plane, component
    contract, authorization, scheduler, cross-repository, or merge decisions.
    Read-only diagnosis is allowed.