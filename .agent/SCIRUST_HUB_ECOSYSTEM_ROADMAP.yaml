roadmap:
  - id: HUB0
    name: Reconcile architecture boundaries with current contracts
    status: active
    goals:
      - audit_README_BOUNDARIES_ADRs_and_current_code_against_each_other
      - update_stale_not_yet_established_notes_only_from_verified_current_contracts
      - publish_one_authoritative_component_ownership_matrix
  - id: HUB1
    name: Strong execution identity and durability
    status: active
    goals:
      - harden_run_attempt_worker_and_artifact_identity
      - preserve_restart_safe_fail_closed_semantics
      - strengthen_duplicate_retry_and_ambiguous_failure_handling
      - keep_lifecycle_events_transactionally_linked_to_authoritative_mutations
  - id: HUB2
    name: Authorization and worker trust
    status: active_worker_trust_next
    completed_slices:
      - id: HUB2_static_control_plane_principals
        status: complete
        issue: 24
        pull_request: 25
        final_exact_head: 5597ceabe04b91a385db3a746c594e2f73705cb4
        merge_commit: d5a1703aa8aeeed3094058e49b34b91cab7cadf0
        required_CI: CI_success_on_final_exact_head
        guarantees:
          - explicit_non_secret_principal_identity_at_HTTP_control_plane_boundary
          - strict_inspect_control_metrics_permission_vocabulary
          - legacy_single_token_full_control_compatibility
          - fail_closed_versioned_multi_principal_configuration
          - unauthorized_401_distinct_from_authenticated_forbidden_403
          - all_current_mutation_categories_covered_by_read_only_403_tests
          - health_and_ready_remain_unauthenticated_and_metrics_permission_is_explicit
          - principal_spoof_headers_do_not_elevate_authority
          - core_lifecycle_history_is_not_rewritten_with_invented_actor_identity
    remaining_goals:
      - evaluate_mTLS_or_equivalent_worker_identity_without_weakening_existing_TLS_validation
      - define_worker_authorization_separately_from_control_plane_principals
      - distinguish_transport_authentication_authorization_and_execution_isolation
      - keep_MCP_read_only_until_agent_mutation_authorization_is_separately_reviewed
  - id: HUB3
    name: Dynamic resource-aware worker plane
    status: planned
    goals:
      - dynamic_worker_registration_and_expiry
      - versioned_worker_capability_and_resource_descriptors
      - deterministic_resource_aware_placement
      - drain_health_and_lease_state_integration
      - no_scheduler_policy_that_silently_overrides_component_invariants
  - id: HUB4
    name: Ecosystem component contract catalog
    status: active
    completed_slices:
      - id: HUB4_SOUP_offline_ship_v1
        status: complete
        capability: llm.ship
        contract_version: 1.0.0
        pull_request: 26
        final_exact_head: a01464ae51f17dfa513bce902e9db5a1f5732abf
        merge_commit: 87546e00c0ae255b47013182d97e06db43a24721
        required_CI: CI_success_on_final_exact_head
      - id: HUB4_SOUP_streamed_artifacts_v1
        status: complete
        pull_request: 27
        final_exact_head: d2b9c57d4dafcfe530424ef075324608da5e17da
        merge_commit: b20b2f66ae8c82f996590d65500c4aff950b3423
        required_CI: CI_success_on_final_exact_head
        guarantees:
          - declared_output_files_are_streamed_into_content_addressed_storage
          - size_limits_are_enforced_during_copy
          - symlink_and_non_regular_outputs_are_rejected_generically
      - id: HUB4_SOUP_train_eval_export_v1
        status: complete
        capabilities:
          - llm.train@1.0.0
          - llm.eval@1.0.0
