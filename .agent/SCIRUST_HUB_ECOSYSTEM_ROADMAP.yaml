schema_version: 1
kind: scirust_hub_ecosystem_agent_roadmap
status: active
last_updated: "2026-09-05"
repository: Memorithm/scirust-hub
intended_consumer: autonomous_coding_agent
merge_policy: never_merge_this_file_to_default_branch_unless_user_explicitly_requests

mission:
  primary: >-
    Evolve SciRust Hub as the registry, orchestration, artifact, provenance, and
    execution control plane of the Memorithm ecosystem without absorbing the
    scientific, runtime, search, verification, or packaging semantics of the
    components it coordinates.
  ecosystem_goal: >-
    Provide a versioned graph of discoverable component capabilities and safe
    orchestration contracts so autonomous agents can compose ecosystem products
    while preserving ownership boundaries, exact artifact identity, provenance,
    cancellation/retry semantics, and fail-closed execution behavior.

verified_current_facts:
  - Hub_registers_ecosystem_components_and_capabilities
  - Hub_has_durable_SQLite_metadata_and_append_only_lifecycle_events
  - Hub_supports_local_and_authenticated_remote_process_execution
  - workflows_support_bounded_parallelism_retries_and_cancellation
  - SciCapsule_execution_is_integrated_through_published_versioned_v1_and_v2_process_contracts
  - SciRust_Verify_scoped_dossier_process_edges_are_published_for_selected_ecosystem_sources
  - NNIS_NNML1_parity_validation_and_Verify_handoff_are_published_as_separate_versioned_capabilities
  - SOUP_ship_train_eval_and_export_are_integrated_through_versioned_llm_contracts
  - SOUP_Elastic_preexecution_resource_plan_handoff_is_integrated_through_llm_train_elastic_1_0_0
  - SOUP_SciRust_symbolic_reward_handoff_is_integrated_through_llm_train_scirust_symbolic_1_0_0
  - Forge_SOUP_posttraining_search_is_integrated_through_llm_optimize_forge_soup_1_0_0
  - Hub_streams_declared_output_artifacts_into_content_addressed_storage
  - SOUP_model_and_export_directories_are_normalized_into_deterministic_bounded_bundles
  - SOUP_ML_capabilities_publish_hub_ml_resource_requirements_1_0_0_resolution_metadata
  - Hub_records_immutable_artifacts_and_execution_provenance
  - Hub_has_read_only_MCP_introspection
  - Hub_has_bearer_authentication_and_optional_native_TLS
  - Hub_has_static_control_plane_principals_with_explicit_inspect_control_and_metrics_permissions
  - Hub_distinguishes_unauthorized_401_from_authenticated_forbidden_403
  - legacy_SCIRUST_HUB_TOKEN_mode_remains_backward_compatible_full_control
  - process_execution_is_supervised_but_not_an_OS_sandbox
  - Hub_HML1_resource_aware_worker_placement_is_not_yet_established
  - Hub_HML2_distributed_ML_orchestration_is_not_yet_established
  - Hub_HML4_qualification_campaign_orchestration_is_not_yet_established
  - current_BOUNDARIES_md_contains_historical_not_yet_established_notes_that_must_be_reconciled_against_newer_published_contracts_before_relying_on_them

invariants:
  - Hub_coordinates_products_but_does_not_absorb_their_domain_implementation
  - registration_never_executes_component_code
  - component_and_protocol_contracts_are_versioned_and_fail_closed_on_unknown_shapes
  - immutable_artifacts_and_authoritative_metadata_are_not_rewritten_to_fake_reproduction
  - retries_get_fresh_attempt_and_run_identity
  - ambiguous_post_dispatch_side_effecting_failures_are_not_blindly_replayed_elsewhere
  - restart_behavior_must_not_silently_repeat_side_effecting_work
  - authentication_is_not_equated_with_authorization_or_sandboxing
  - transport_principal_identity_is_not_retroactively_invented_for_historical_core_events
  - required_CI_must_be_green_on_exact_PR_head_before_merge

ownership:
  role: ecosystem_control_plane
  owns:
    - component_registry_and_capability_discovery
    - component_manifest_validation_and_identity
    - run_and_workflow_lifecycle
    - executor_abstraction_and_worker_placement
    - artifact_metadata_blob_flow_and_orchestration_provenance
    - lifecycle_event_stream
    - Hub_HTTP_CLI_and_read_only_MCP_interfaces
    - ecosystem_component_contract_registry_at_the_control_plane_boundary
  does_not_own:
    - SciRust_scientific_tensor_algorithm_or_autodiff_implementation
    - SciCapsule_scicap_format_trust_policy_or_capsule_execution_semantics
    - SciRust_Verify_evidence_dossier_claim_evaluation_or_verdict_semantics
    - Forge_candidate_search_strategy
    - ElasticXxx_adaptive_resource_control_loop
    - FLAT_ATTENTION_attention_kernel_semantics
    - NNIS_native_inference_runtime_parity_or_promotion_semantics
    - SLHAv2_compressed_KV_semantics
    - SOUP_training_evaluation_model_loading_export_or_verdict_semantics
    - nonlocal_relativity_scientific_models_or_interpretation

ecosystem_graph:
  substrate:
    Memorithm/scirust:
      role: scientific_numerical_tensor_and_shared_primitive_substrate
  adaptive_control:
    Memorithm/ElasticXxx:
      role: generic_resource_observe_plan_validate_act_verify_commit_or_rollback_runtime
  specialized_runtime_and_algorithms:
    Memorithm/NVIDIA-Native-Inference-Stack:
      role: native_NVIDIA_model_runtime
    Memorithm/FLAT-ATTENTION:
      role: fused_attention_engine
    Memorithm/SLHAv2:
      role: compressed_KV_cache_and_real_model_integration_product
  optimization_search:
    Memorithm/forge:
      role: execution_driven_candidate_search_engine
  llm_post_training:
    MakazhanAlpamys/Soup:
      role: independent_LLM_post_training_evaluation_and_export_product
  verification:
    Memorithm/SciRust-Verify:
      role: evidence_dossier_integrity_scope_and_verdict_layer
  portable_execution:
    Memorithm/SciCapsule:
      role: portable_reproducible_capsule_product_and_trusted_bounded_execution_contract
  research_incubation:
    Memorithm/nonlocal-relativity-v2:
      role: relativity_and_nonlocal_relativity_research_incubator_and_evidence_source
  control_plane:
    Memorithm/scirust-hub:
      role: registry_orchestration_artifact_and_provenance_control_plane

contract_policy:
  rules:
    - no_edge_in_the_ecosystem_graph_exists_operationally_until_a_versioned_contract_is_published_and_tested
    - conceptual_relationships_must_not_be_treated_as_wire_contracts
    - Hub_adapters_validate_known_contract_versions_but_do_not_reimplement_component_semantics
    - every_component_run_records_component_version_input_artifact_identity_and_execution_provenance
    - cross_component_workflows_pass_immutable_artifacts_or_explicit_typed_parameters_not_hidden_shared_state
    - producer_validation_results_must_be_passed_as_immutable_artifacts_not_reconstructed_from_stdout_or_Hub_metadata

